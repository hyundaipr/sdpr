// ── LOGIN SUCCESS ──
async function handleLoginSuccess(account, accessToken) {
  load('Verificando acceso...');
  try {

    let graphToken = accessToken;

    try {
      const graphResp = await msalInstance.acquireTokenSilent({
        ...graphRequest,
        account
      });
      graphToken = graphResp.accessToken;
    } catch(e){}

    const profileRes = await fetch('https://graph.microsoft.com/v1.0/me', {
      headers: { 'Authorization':'Bearer '+graphToken }
    });

    const profile = await profileRes.json();

    const email = (profile.userPrincipalName || account.username || '').trim();
    const name  = profile.displayName || account.name || email;

    // ✅ VALIDACIÓN CORRECTA (GENESIS + HYUNDAI)
    const roleData = await checkUserAccess(email, graphToken);

    if(!roleData){
      unload();
      showLoginError(`La cuenta ${email} no tiene acceso.`);
      return;
    }

    S.user = {
      name,
      email,
      role: roleData.Role,
      dealer: roleData.Dealer,
      token: graphToken
    };

    showApp();

  } catch(e){
    console.error(e);
    unload();
    showLoginError('Error validando usuario');
  }
}

// ✅ FIX CLAVE AQUÍ (soporta genesis + limpia espacios)
async function checkUserAccess(email, token) {
  try {

    const siteId = await getSharePointSiteId(token);
    if(!siteId) return null;

    const url = `https://graph.microsoft.com/v1.0/sites/${siteId}/lists/Config_Users/items?$expand=fields&$top=50`;

    const res = await fetch(url, {
      headers:{ 'Authorization':'Bearer '+token }
    });

    const data = await res.json();
    const items = data?.value || [];

    const match = items.find(i=>{
      const userField = (i.fields?.User || i.fields?.Title || '').trim().toLowerCase();
      return userField === email.trim().toLowerCase();
    });

    return match ? {
      Role: match.fields?.Role,
      Dealer: match.fields?.Dealer
    } : null;

  } catch(e){
    console.error(e);
    return null;
  }
}

// helper
async function getSharePointSiteId(token){
  try{
    const res = await fetch('https://graph.microsoft.com/v1.0/sites/hyundaipr.sharepoint.com:/sites/GPR',{
      headers:{'Authorization':'Bearer '+token}
    });
    const data = await res.json();
    return data?.id || null;
  }catch(e){
    return null;
  }
}

    Time:S.sel.time||'',

  };

  try{

      method:'POST',

    }
